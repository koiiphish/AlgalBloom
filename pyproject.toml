[project]
name = "hab-forecaster"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "copernicusmarine==2.5.1",
    "geopandas==1.2.0",
    "matplotlib==3.11.2",
    "netcdf4==1.7.5.1.post1",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "shapely==2.2.0",
    "xarray==2026.9.0",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
    "nbconvert==7.17.2",
    "nbformat==5.11.1",
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
