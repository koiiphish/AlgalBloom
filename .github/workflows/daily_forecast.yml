# Daily forecast (Phase 4): fetch the newest satellite data, score every Tasmanian harvest area,
# render the map layers, publish the static files to the gh-pages branch, and commit the
# forecast archive to main. See pipeline/forecast/daily.py and docs/decisions.md D014.
#
# "Fail loudly": if the forecast inputs are missing, yesterday's files are republished marked
# stale (status.json), and the job fails so GitHub emails the repo owner. A missing map layer
# publishes the forecast without it and also fails the job.
name: daily_forecast

on:
  schedule:
    # 22:00 UTC = 09:00 Hobart in summer (AEDT) / 08:00 in winter (AEST): the issue date is
    # "today in Hobart". One hour after archive_status, so the two bots rarely overlap.
    - cron: "0 22 * * *"
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

permissions:
  contents: write # push gh-pages and commit archive/ to main

concurrency:
  group: daily_forecast # never run two forecasts at once
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # brief: under ~15 min per daily run (a local run takes ~1 min)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so "pull --rebase" before pushing always works
      - uses: astral-sh/setup-uv@v10.3.3 # exact tag: setup-uv publishes no floating "v10" tag
        with:
          version: "0.13.8"
          enable-cache: true
      - name: Install dependencies (exactly as locked)
        run: uv sync --frozen

      # theLIST harvest-area polygons are needed to choose satellite pixels, but are never
      # committed or published (licence pending; D014 decision A). The weekly cache key means
      # at most one request to theLIST per week.
      - name: Cache key for the week
        id: week
        run: echo "key=thelist-$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: data/raw/thelist
          key: ${{ steps.week.outputs.key }}

      - name: Get the previous site (kept if today's inputs fail)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth 1 origin gh-pages
            mkdir -p prev_site
            git archive FETCH_HEAD | tar -x -C prev_site
          else
            echo "No gh-pages branch yet (first run)."
          fi

      - name: Forecast
        id: forecast
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        # Don't stop on a non-zero exit yet: publish (or republish as stale) first.
        run: |
          set +e
          uv run python -m pipeline.forecast.daily --site _site --previous prev_site --archive
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Publish to gh-pages (single commit, force-pushed; only a rolling window of files)
        if: hashFiles('_site/status.json') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Forecast $(date -u +%Y-%m-%d) (run ${{ github.run_id }})"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Commit the forecast archive to main
        if: steps.forecast.outputs.code != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive/
          if git diff --cached --quiet; then
            echo "No archive changes."
            exit 0
          fi
          git commit -q -m "Archive forecast $(date -u +%Y-%m-%d)"
          # archive_status also commits to main; rebase on top of it and retry a few times.
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1

      - name: Fail loudly if the forecast reported a problem
        if: steps.forecast.outputs.code != '0'
        run: |
          echo "Forecast exit code ${{ steps.forecast.outputs.code }} (1 = stale: inputs missing, previous output kept; 2 = published, but a map layer or SST context failed)."
          echo "See the 'Forecast' step log for PROBLEM / HARD FAILURE lines, and status.json on gh-pages."
          exit 1
